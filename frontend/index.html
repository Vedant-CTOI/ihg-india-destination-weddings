<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IHG India | Luxury Destination Weddings</title>
  <meta name="description" content="Curate timeless Indian destination weddings at IHG Hotels & Resorts. Palaces, coastal sanctuaries, sacred shores, and mindful luxury celebrations.">

  <!-- Google Fonts: Outfit, Playfair Display, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#000000',
              navy: '#000000',
              cream: '#F7F7F7',
              gold: '#737373',
              sand: '#EFEFEF',
              muted: '#737373',
              border: '#E5E5E5'
            }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
            body: ['Inter', 'sans-serif']
          },
          keyframes: {
            'ken-burns': {
              '0%': { transform: 'scale(1)' },
              '100%': { transform: 'scale(1.08)' }
            },
            'fade-in': {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          },
          animation: {
            'ken-burns': 'ken-burns 22s ease-out infinite alternate',
            'fade-in': 'fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          }
        }
      }
    }
  </script>

  <style>
    /* Custom sleek monochrome scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #F7F7F7;
    }
    ::-webkit-scrollbar-thumb {
      background: #A3A3A3;
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Grayscale imagery filter for true monochrome luxury editorial aesthetic */
    .img-monochrome {
      filter: grayscale(100%) contrast(108%);
    }
  </style>

  </head>
<body class="bg-white text-black font-body antialiased selection:bg-black selection:text-white">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
