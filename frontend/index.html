<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IHG India | Luxury Destination Weddings</title>
  <meta name="description" content="Curate timeless Indian destination weddings at IHG Hotels & Resorts. Palaces, coastal sanctuaries, sacred shores, and mindful luxury celebrations.">

  <!-- Google Fonts: Outfit, Playfair Display, Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#000000',
              navy: '#000000',
              cream: '#F7F7F7',
              gold: '#737373',
              sand: '#EFEFEF',
              muted: '#737373',
              border: '#E5E5E5'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Inter', 'sans-serif'],
            body: ['Inter', 'sans-serif']
          },
          keyframes: {
            'ken-burns': {
              '0%': { transform: 'scale(1)' },
              '100%': { transform: 'scale(1.08)' }
            },
            'fade-in': {
              '0%': { opacity: '0', transform: 'translateY(16px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          },
          animation: {
            'ken-burns': 'ken-burns 22s ease-out infinite alternate',
            'fade-in': 'fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          }
        }
      }
    }
  </script>

  <style>
    /* Custom sleek monochrome scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #F7F7F7;
    }
    ::-webkit-scrollbar-thumb {
      background: #A3A3A3;
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Grayscale imagery filter for true monochrome luxury editorial aesthetic */
    .img-monochrome {
      filter: grayscale(100%) contrast(108%);
    }

    /* ─── WIREFRAME MODE ───
       All images render as flat grey blocks (traditional UX wireframe style).
       Layout boxes are preserved; pixel content is fully hidden. */
    img {
      visibility: hidden !important;   /* never show actual pixels */
      background-color: #E5E5E5 !important; /* the grey block itself */
      border-radius: inherit;
    }
    /* Fill the whole reserved area even if the img box is smaller than its frame */
    img {
      min-width: 100%;
      min-height: 100%;
    }
    /* Containers whose only visual content is an image become grey blocks too */
    div:has(> img:only-child),
    a:has(> img:only-child),
    button:has(> img:only-child) {
      background-color: #E5E5E5;
    }
    /* Dark image frames (bg-black / bg-neutral-900 wrappers) also read grey */
    [class*="bg-black"]:has(img),
    [class*="bg-neutral-900"]:has(img),
    [class*="bg-neutral-950"]:has(img) {
      background-color: #E5E5E5 !important;
    }
    /* Hide gradient/darkening overlays inside image containers so blocks read flat grey */
    [class*="bg-black"]:has(img) div[class*="bg-gradient"],
    [class*="bg-neutral-900"]:has(img) div[class*="bg-gradient"],
    [class*="bg-neutral-950"]:has(img) div[class*="bg-gradient"],
    div:has(> img:only-child) div[class*="bg-gradient"],
    a:has(> img:only-child) div[class*="bg-gradient"] {
      display: none !important;
    }

    /* ─── DIALOG OVERLAY EXEMPTION — proper dim backdrop for popups ─── */
    .fixed.inset-0[role="dialog"] {
      background-color: rgba(0, 0, 0, 0.82) !important;
    }
    .fixed.inset-0[role="dialog"] img {
      visibility: visible !important;
    }

    /* ─── FOOTER EXEMPTION FROM WIREFRAME MODE ───
       Footer images render as real images; footer backgrounds stay black. */
    footer img {
      visibility: visible !important;
      background-color: transparent !important;
      min-width: 0 !important;
      min-height: 0 !important;
    }
    footer[class*="bg-black"],
    footer [class*="bg-black"] {
      background-color: #000000 !important;
    }
    div:has(> footer img:only-child),
    a:has(> footer img:only-child) {
      background-color: transparent !important;
    }

    /* ─── GREY-SURFACE CONTRAST FIX ───
       Muted text on grey panels darkened; white text untouched. */
    .bg-neutral-50 .text-neutral-400,
    .bg-neutral-50 .text-neutral-500,
    .bg-neutral-100 .text-neutral-400,
    .bg-neutral-100 .text-neutral-500 {
      color: #000000 !important;
    }
    .bg-neutral-50 .text-neutral-600,
    .bg-neutral-100 .text-neutral-600 {
      color: #1a1a1a !important;
    }
    /* ═══ MOBILE LAYOUT MODE (temporary toggle) — html.layout-mobile ═══
     Same site, phone-canvas geometry. Toggle removes the class and everything reverts. */
  html.layout-mobile #root { max-width: 430px; margin: 0 auto; min-height: 100vh;
    box-shadow: 0 0 40px rgba(0,0,0,.08); background: #fff; }

  /* Header: force the compact (mobile) header even on wide screens */
  html.layout-mobile header > div > div.hidden.lg\:flex { display: none !important; }
  html.layout-mobile header > div > div.flex.lg\:hidden { display: flex !important; }
  html.layout-mobile header nav { flex-wrap: wrap; justify-content: flex-start !important; }

  /* Filter bars: one filter per row */
  html.layout-mobile .grid.md\:grid-cols-12 { display: grid !important; grid-template-columns: 1fr !important; }
  html.layout-mobile .grid.md\:grid-cols-12 > [class*="md:col-span-"] { grid-column: auto !important; }

  /* Multi-column content grids collapse */
  html.layout-mobile .grid.grid-cols-3 { grid-template-columns: 1fr !important; }
  html.layout-mobile .grid.grid-cols-4 { grid-template-columns: repeat(2, 1fr) !important; }
  html.layout-mobile .grid.sm\:grid-cols-2 { grid-template-columns: 1fr !important; }
  html.layout-mobile .grid.sm\:grid-cols-3 { grid-template-columns: 1fr !important; }
  html.layout-mobile .grid.grid-cols-2 { grid-template-columns: repeat(2, 1fr) !important; }

  /* Hotel detail side rail: unhook sticky + fixed width, stack inline (covers open+collapsed states) */
  html.layout-mobile .sticky.w-\[400px\], html.layout-mobile .sticky.w-12 { position: static !important; width: 100% !important; max-width: 100% !important; }
  html.layout-mobile .sticky.top-20 { position: static !important; }

  /* Hotel selector popup -> bottom sheet */
  html.layout-mobile .fixed.inset-0.z-50 { align-items: flex-end !important; padding: 0 !important; }
  html.layout-mobile .fixed.inset-0.z-50 > .max-w-3xl { max-width: 100% !important; width: 100% !important;
    border-radius: 24px 24px 0 0 !important; max-height: 86vh !important; margin-bottom: 0 !important; }

  /* Personas / segmented buttons stack full-width */
  html.layout-mobile form .flex.items-center.space-x-2:has(> button) { flex-direction: column; align-items: stretch; }
  html.layout-mobile form .flex.items-center.space-x-2 > button { width: 100%; }

  /* Hero + carousels: trim height */
  html.layout-mobile .aspect-\[16\/7\] { aspect-ratio: 16/10 !important; }
  html.layout-mobile .aspect-\[16\/9\] { aspect-ratio: 3/2 !important; }

  /* Key Highlights: 7-item grid -> 2 cols */
  html.layout-mobile .grid.grid-cols-4.gap-x-4 { grid-template-columns: repeat(2, 1fr) !important; }
</style>

  </head>
<body class="bg-white text-black font-body antialiased selection:bg-black selection:text-white">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
<script type="module" src="/index.js"></script></body>
</html>
