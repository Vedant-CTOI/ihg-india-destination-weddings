<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>

  <!-- Tailwind CSS CDN -->

  <script>

      theme: {
        extend: {
          colors: {
            brand: {

            'fade-in': {

  <style>
    /* Custom sleek monochrome scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #F7F7F7;
    }
    ::-webkit-scrollbar-thumb {
      background: #A3A3A3;
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Grayscale imagery filter for true monochrome luxury editorial aesthetic */
    .img-monochrome {
      filter: grayscale(100%) contrast(108%);
    }

    /* ─── WIREFRAME MODE ───
       All images render as flat grey blocks (traditional UX wireframe style).
       Layout boxes are preserved; pixel content is fully hidden. */
    img {
      visibility: hidden !important;   /* never show actual pixels */
      background-color: #E5E5E5 !important; /* the grey block itself */
      border-radius: inherit;
    }
    /* Fill the whole reserved area even if the img box is smaller than its frame */
    img {
      min-width: 100%;
      min-height: 100%;
    }
    /* Containers whose only visual content is an image become grey blocks too */
    div:has(> img:only-child),
    a:has(> img:only-child),
    button:has(> img:only-child) {
      background-color: #E5E5E5;
    }
    /* Dark image frames (bg-black / bg-neutral-900 wrappers) also read grey */
    [class*="bg-black"]:has(img),
    [class*="bg-neutral-900"]:has(img),
    [class*="bg-neutral-950"]:has(img) {
      background-color: #E5E5E5 !important;
    }
    /* Hide gradient/darkening overlays inside image containers so blocks read flat grey */
    [class*="bg-black"]:has(img) div[class*="bg-gradient"],
    [class*="bg-neutral-900"]:has(img) div[class*="bg-gradient"],
    [class*="bg-neutral-950"]:has(img) div[class*="bg-gradient"],
    div:has(> img:only-child) div[class*="bg-gradient"],
    a:has(> img:only-child) div[class*="bg-gradient"] {
      display: none !important;
    }

    /* ─── DIALOG OVERLAY EXEMPTION — proper dim backdrop for popups ─── */
    .fixed.inset-0[role="dialog"] {
      background-color: rgba(0, 0, 0, 0.82) !important;
    }
    .fixed.inset-0[role="dialog"] img {
      visibility: visible !important;
    }

    /* ─── FOOTER EXEMPTION FROM WIREFRAME MODE ───
       Footer images render as real images; footer backgrounds stay black. */
    footer img {
      visibility: visible !important;
      background-color: transparent !important;
      min-width: 0 !important;
      min-height: 0 !important;
    }
    footer[class*="bg-black"],
    footer [class*="bg-black"] {
      background-color: #000000 !important;
    }
    div:has(> footer img:only-child),
    a:has(> footer img:only-child) {
      background-color: transparent !important;
    }

    /* ─── GREY-SURFACE CONTRAST FIX ───
       Muted text on grey panels darkened; white text untouched. */
    .bg-neutral-50 .text-neutral-400,
    .bg-neutral-50 .text-neutral-500,
    .bg-neutral-100 .text-neutral-400,
    .bg-neutral-100 .text-neutral-500 {
      color: #000000 !important;
    }
    .bg-neutral-50 .text-neutral-600,
    .bg-neutral-100 .text-neutral-600 {
      color: #1a1a1a !important;
    }

  html.layout-mobile #root [class*="w-[500px]"], html.layout-mobile #root [class*="w-[600px]"],
  html.layout-mobile #root [class*="w-[800px]"], html.layout-mobile #root .w-96, html.layout-mobile #root .w-80,
  html.layout-mobile #root .w-72, html.layout-mobile #root .w-64, html.layout-mobile #root .w-full-fixed { width: 100% !important; max-width: 100% !important; }

  html.layout-mobile #root .grid.grid-cols-2, html.layout-mobile #root .grid.grid-cols-3,
  html.layout-mobile #root .grid.grid-cols-4, html.layout-mobile #root .grid.grid-cols-5,
  html.layout-mobile #root .grid.md\:grid-cols-2, html.layout-mobile #root .grid.md\:grid-cols-12,

  /* Persona / segmented 3-up rows stack full-width (labels were cutting at 95px) */

  html.layout-mobile .sticky.top-20 { position: static !important; }

  /* Popup -> bottom sheet */

  /* Persona/segmented rows stack full-width */

  html.layout-mobile #root form .flex.items-center.space-x-2 > button,
  html.layout-mobile #root form .flex.items-center.gap-2 > button { width: 100%; }

  /* Media ratios trimmed for taller phone feel */
  html.layout-mobile .aspect-\[16\/7\] { aspect-ratio: 16/10 !important; }
  html.layout-mobile .aspect-\[16\/9\] { aspect-ratio: 3/2 !important; }
  html.layout-mobile .aspect-\[4\/3\] { aspect-ratio: 4/3 !important; }

  /* ═══ MOBILE v3 — DENSITY PASS: not a compressed desktop ═══ */
  /* Hero: 55vh, no subtext spacing waste, dot-style counters */
  html.layout-mobile #root section.min-h-\[85vh\], html.layout-mobile #root [class*="min-h-[85vh]"] { min-height: 55vh !important; }
  html.layout-mobile #root [class*="lg:min-h-"] { min-height: 55vh !important; }
  /* hero headline block tighter */

  /* Media shrinks: carousels to 3:2, generic 16:9 media to 2:1 evidence-size */

  html.layout-mobile .aspect-video { aspect-ratio: 2/1 !important; }

  /* About stat strip: 3 tight numbers */
  html.layout-mobile #root .grid.grid-cols-2.sm\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0,1fr)) !important; padding: 8px 0 !important; }

  /* Hotel cards in carousels -> compact horizontal cards */
  html.layout-mobile #root .grid.md\:grid-cols-2.lg\:grid-cols-3 > div { display: flex !important; flex-direction: row !important; align-items: stretch !important; }
  /* thumb column narrow */

  html.layout-mobile #root .grid.md\:grid-cols-2.lg\:grid-cols-3 > div > div:first-child .aspect-\[4\/3\] { aspect-ratio: 1/1 !important; height: 100% !important; }

  /* Story cards: image short, text clipped */
  html.layout-mobile #root article .aspect-\[4\/3\], html.layout-mobile #root article .aspect-video { aspect-ratio: 2/1 !important; }

  /* Loyalty tier card media smaller */
  html.layout-mobile #root .aspect-\[16\/9\].w-full { aspect-ratio: 3/1 !important; }

  /* Content trims — critical info only */
  /* hero subtext paragraph hidden */
  html.layout-mobile #root section[class*="min-h"] > div p,
  html.layout-mobile #root section.min-h-\[55vh\] p { display: none !important; }
  /* story/body paragraphs clamp */
  html.layout-mobile #root article p { display: -webkit-box !important; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden !important; }
  /* section intro paragraphs clamp to 3 lines */

  /* Key Highlights 7 -> 4 (drop items 5-7 on mobile) */
  html.layout-mobile #root .grid.grid-cols-4.gap-x-4 > div:nth-child(n+5) { display: none !important; }
  html.layout-mobile #root .grid.grid-cols-4.gap-x-4 { grid-template-columns: repeat(2, minmax(0,1fr)) !important; }
  /* hide long 'View more / read description' trailing copy inside hotel cards */

  /* Homepage snap carousels (hotels, genres, stories): full-width slides, no squashing */

  /* Destination cards: fixed 30rem height -> compact hotel-card-like height */

  /* About stats: single horizontal line, smaller text */

  html.layout-mobile #root .snap-start .group.bg-white.rounded-2xl > div:first-child { height: 200px !important; min-height: 200px !important; max-height: 200px !important; overflow: hidden !important; }
  html.layout-mobile #root .snap-start .group.bg-white.rounded-2xl img { height: 200px !important; max-height: 200px !important; object-fit: cover !important; }
